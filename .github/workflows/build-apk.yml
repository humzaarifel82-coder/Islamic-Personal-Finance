name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android assets
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      # ==========================================
      # APPLY NATIVE PDF SHARING FIX
      # ==========================================
      - name: Apply native PDF sharing fix
        shell: bash
        run: |
          set -e

          echo "Applying native Android PDF sharing..."

          # Java directory
          mkdir -p android/app/src/main/java/com/humzaarif/islamicfinance

          # XML directory
          mkdir -p android/app/src/main/res/xml

          # Copy MainActivity
          if [ -f "android-patch/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java" ]; then
            cp android-patch/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java \
              android/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java
            echo "MainActivity.java copied."
          else
            echo "ERROR: MainActivity.java not found!"
            exit 1
          fi

          # Copy FileProvider paths
          if [ -f "android-patch/app/src/main/res/xml/file_paths.xml" ]; then
            cp android-patch/app/src/main/res/xml/file_paths.xml \
              android/app/src/main/res/xml/file_paths.xml
            echo "file_paths.xml copied."
          else
            echo "ERROR: file_paths.xml not found!"
            exit 1
          fi

          # ==========================================
          # Add FileProvider to AndroidManifest
          # ==========================================

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "androidx.core.content.FileProvider" "$MANIFEST"; then

            python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          provider = '''
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
          '''

          if "</application>" in text:
              text = text.replace("</application>", provider + "\n    </application>")
              manifest.write_text(text)
              print("FileProvider added to AndroidManifest.xml")
          else:
              raise SystemExit("ERROR: </application> not found")
          PY

          else
            echo "FileProvider already exists."
          fi

          echo "Native PDF sharing fix applied successfully."

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamic-personal-finance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
