name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android assets
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Apply native Android patch
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Applying native Android patch"
          echo "======================================"

          mkdir -p android/app/src/main/java/com/humzaarif/islamicfinance
          mkdir -p android/app/src/main/res/xml

          MAIN_ACTIVITY="android-patch/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java"
          FILE_PATHS="android-patch/app/src/main/res/xml/file_paths.xml"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MAIN_ACTIVITY" ]; then
            echo "ERROR: MainActivity.java not found!"
            echo "Expected:"
            echo "$MAIN_ACTIVITY"
            exit 1
          fi

          if [ ! -f "$FILE_PATHS" ]; then
            echo "ERROR: file_paths.xml not found!"
            echo "Expected:"
            echo "$FILE_PATHS"
            exit 1
          fi

          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

          cp "$MAIN_ACTIVITY" \
            android/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java

          cp "$FILE_PATHS" \
            android/app/src/main/res/xml/file_paths.xml

          echo "MainActivity.java copied."
          echo "file_paths.xml copied."

          if ! grep -q "androidx.core.content.FileProvider" "$MANIFEST"; then

            python3 <<'PY'
from pathlib import Path

manifest = Path(
    "android/app/src/main/AndroidManifest.xml"
)

text = manifest.read_text()

provider = """
        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">

            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/file_paths" />

        </provider>
"""

if "</application>" not in text:
    raise SystemExit(
        "ERROR: </application> not found in AndroidManifest.xml"
    )

text = text.replace(
    "</application>",
    provider + "\n    </application>",
    1
)

manifest.write_text(text)

print("FileProvider added successfully.")
PY

          else
            echo "FileProvider already exists."
          fi

          echo "======================================"
          echo "Native Android patch completed"
          echo "======================================"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: islamic-personal-finance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
