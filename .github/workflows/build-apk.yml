name: Build Android APK

on:
  push:
    branches: ["main"]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"


      # ============================================================
      # NPM DEPENDENCIES
      # ============================================================

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps


      # ============================================================
      # ADD ANDROID PLATFORM
      # ============================================================

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi


      # ============================================================
      # SYNC CAPACITOR
      # ============================================================

      - name: Sync Capacitor
        run: npx cap sync android


      # ============================================================
      # GENERATE APP ICONS / SPLASH
      # ============================================================

      - name: Generate Android assets
        run: |
          npx @capacitor/assets generate --android
        continue-on-error: true


      # ============================================================
      # APPLY NATIVE ANDROID PATCH
      # ============================================================

      - name: Apply native Android sharing and printing
        shell: bash
        run: |

          set -e

          echo "========================================"
          echo "Applying native Android patch"
          echo "========================================"


          # --------------------------------------------------------
          # Create required directories
          # --------------------------------------------------------

          mkdir -p \
            android/app/src/main/java/com/humzaarif/islamicfinance

          mkdir -p \
            android/app/src/main/res/xml


          # --------------------------------------------------------
          # Check MainActivity.java
          # --------------------------------------------------------

          if [ ! -f "android-patch/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java" ]; then

            echo "ERROR: MainActivity.java not found!"

            exit 1

          fi


          # --------------------------------------------------------
          # Copy MainActivity.java
          # --------------------------------------------------------

          cp \
            android-patch/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java \
            android/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java


          echo "MainActivity.java copied successfully."


          # --------------------------------------------------------
          # Check file_paths.xml
          # --------------------------------------------------------

          if [ ! -f "android-patch/app/src/main/res/xml/file_paths.xml" ]; then

            echo "ERROR: file_paths.xml not found!"

            exit 1

          fi


          # --------------------------------------------------------
          # Copy file_paths.xml
          # --------------------------------------------------------

          cp \
            android-patch/app/src/main/res/xml/file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml


          echo "file_paths.xml copied successfully."


          # ========================================================
          # ADD FILE PROVIDER TO ANDROID MANIFEST
          # ========================================================

          MANIFEST="android/app/src/main/AndroidManifest.xml"


          if [ ! -f "$MANIFEST" ]; then

            echo "ERROR: AndroidManifest.xml not found!"

            exit 1

          fi


          if ! grep -q "androidx.core.content.FileProvider" "$MANIFEST"; then

            python3 - <<'PY'

from pathlib import Path

manifest = Path(
    "android/app/src/main/AndroidManifest.xml"
)

text = manifest.read_text()


provider = '''
        <provider
            android:name="androidx.core.content.FileProvider"
            android:authorities="${applicationId}.fileprovider"
            android:exported="false"
            android:grantUriPermissions="true">

            <meta-data
                android:name="android.support.FILE_PROVIDER_PATHS"
                android:resource="@xml/file_paths" />

        </provider>
'''


if "</application>" not in text:

    raise SystemExit(
        "ERROR: </application> not found in AndroidManifest.xml"
    )


text = text.replace(
    "</application>",
    provider + "\n    </application>"
)


manifest.write_text(text)

print(
    "FileProvider added to AndroidManifest.xml"
)

PY

          else

            echo "FileProvider already exists."

          fi


          echo "========================================"
          echo "Native Android patch completed"
          echo "========================================"


      # ============================================================
      # GRANT GRADLE PERMISSION
      # ============================================================

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew


      # ============================================================
      # BUILD APK
      # ============================================================

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon


      # ============================================================
      # UPLOAD APK
      # ============================================================

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamic-personal-finance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
