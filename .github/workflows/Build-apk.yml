name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android assets
        run: npx @capacitor/assets generate --android
        continue-on-error: true

      - name: Apply native PDF sharing fix
        run: |
          echo "Applying native Android sharing configuration..."

          # Create required directories
          mkdir -p android/app/src/main/java/com/humzaarif/islamicfinance
          mkdir -p android/app/src/main/res/xml

          # Copy native sharing files if present in repository
          if [ -f "android-patch/MainActivity.java" ]; then
            cp android-patch/MainActivity.java \
              android/app/src/main/java/com/humzaarif/islamicfinance/MainActivity.java
          fi

          if [ -f "android-patch/file_paths.xml" ]; then
            cp android-patch/file_paths.xml \
              android/app/src/main/res/xml/file_paths.xml
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: islamic-personal-finance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
